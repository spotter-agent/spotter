prompt = "Harden endpoint canonicalization: accept only HTTPS service URLs, reject credentials, query strings, fragments, invalid hosts or ports, traversal and encoded path separators, preserve path case and non-default ports, canonicalize IPv4/host/IPv6 forms, and deduplicate in first-seen order. Preserve canonicalize_endpoints(values) -> list[str]."

