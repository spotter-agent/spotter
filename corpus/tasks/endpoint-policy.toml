[known_good]
command = """
python3 - <<'PY'
from pathlib import Path

Path("endpoints.py").write_text('''from collections.abc import Iterable
from urllib.parse import unquote, urlsplit


class EndpointError(ValueError):
    pass


def _canonicalize(value: str) -> str:
    raw = value.strip()
    try:
        parsed = urlsplit(raw)
        port = parsed.port
    except ValueError as error:
        raise EndpointError("invalid port") from error
    if parsed.scheme.lower() != "https":
        raise EndpointError("endpoint must use https")
    if parsed.username is not None or parsed.password is not None:
        raise EndpointError("credentials are forbidden")
    if parsed.query:
        raise EndpointError("query strings are forbidden")
    if parsed.fragment:
        raise EndpointError("fragments are forbidden")
    host = parsed.hostname
    if not host or any(character.isspace() for character in host):
        raise EndpointError("invalid host")
    if port is not None and not 1 <= port <= 65535:
        raise EndpointError("invalid port")

    path = parsed.path or "/"
    lowered = path.lower()
    if "%2f" in lowered or "%5c" in lowered:
        raise EndpointError("encoded separator is forbidden")
    if "\\\\\\\\" in path:
        raise EndpointError("backslash separator is forbidden")
    decoded = unquote(path)
    if any(part in {".", ".."} for part in decoded.split("/")):
        raise EndpointError("path traversal is forbidden")
    path = path.rstrip("/") or "/"

    normalized_host = host.lower()
    rendered_host = f"[{normalized_host}]" if ":" in normalized_host else normalized_host
    rendered_port = "" if port in {None, 443} else f":{port}"
    return f"https://{rendered_host}{rendered_port}{path}"


def canonicalize_endpoints(values: Iterable[str]) -> list[str]:
    return list(dict.fromkeys(_canonicalize(value) for value in values))
''')
PY
"""
timeout_s = 30

