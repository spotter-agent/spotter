[known_good]
command = """
python3 - <<'PY'
from pathlib import Path

Path("trace_index.py").write_text('''from dataclasses import dataclass


class TraceConflict(ValueError):
    pass


@dataclass(frozen=True)
class Event:
    event_id: str
    epoch: int
    item_id: str
    kind: str
    timestamp: int
    outcome: str | None = None


@dataclass(frozen=True)
class Action:
    epoch: int
    item_id: str
    observed_start: bool
    outcome: str | None
    last_timestamp: int
    out_of_order: bool


class TraceIndex:
    def __init__(self) -> None:
        self.actions: dict[tuple[int, str], Action] = {}
        self._events: dict[str, Event] = {}

    def ingest(self, event: Event) -> Action:
        if event.kind not in {"start", "terminal"}:
            raise TraceConflict("unsupported event kind")
        if event.kind == "terminal" and event.outcome is None:
            raise TraceConflict("terminal outcome is required")
        previous_event = self._events.get(event.event_id)
        if previous_event is not None:
            if previous_event != event:
                raise TraceConflict("event_id collision")
            return self.actions[(event.epoch, event.item_id)]

        key = (event.epoch, event.item_id)
        previous = self.actions.get(key)
        if (
            event.kind == "terminal"
            and previous is not None
            and previous.outcome is not None
            and previous.outcome != event.outcome
        ):
            raise TraceConflict("conflicting terminal outcome")

        observed_start = event.kind == "start" or bool(previous and previous.observed_start)
        outcome = previous.outcome if previous is not None else None
        if event.kind == "terminal":
            outcome = event.outcome
        last_timestamp = max(event.timestamp, previous.last_timestamp if previous else event.timestamp)
        out_of_order = bool(previous and (previous.out_of_order or event.timestamp < previous.last_timestamp))
        action = Action(
            event.epoch,
            event.item_id,
            observed_start,
            outcome,
            last_timestamp,
            out_of_order,
        )
        self._events[event.event_id] = event
        self.actions[key] = action
        return action
''')
PY
"""
