prompt = "Repair TraceIndex so events correlate by epoch plus item identity, exact duplicate event IDs are idempotent, ID collisions and conflicting terminal outcomes fail without mutation, terminal-before-start state is retained, late starts cannot regress outcomes, and timestamp regressions remain visible. Preserve the Event, Action, TraceConflict, TraceIndex, and ingest APIs."

