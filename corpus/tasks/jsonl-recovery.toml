prompt = "Make the append-only ledger reader accept complete schema-v1 records with or without a final newline, tolerate only an actually torn final record, return the exact safe repair offset, and reject interior corruption, complete corrupt tails, blank records, future schemas, and invalid record identities. Preserve the public ReadResult and read_ledger API."

