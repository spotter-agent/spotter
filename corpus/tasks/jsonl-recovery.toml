[known_good]
command = """
python3 - <<'PY'
from pathlib import Path

Path("ledger.py").write_text('''import json
from dataclasses import dataclass
from pathlib import Path


class LedgerError(ValueError):
    pass


@dataclass(frozen=True)
class ReadResult:
    records: tuple[dict[str, object], ...]
    repair_offset: int


def read_ledger(path: Path) -> ReadResult:
    data = path.read_bytes()
    lines = data.splitlines(keepends=True)
    records: list[dict[str, object]] = []
    offset = 0
    for index, raw in enumerate(lines):
        complete = raw.endswith(b"\\\\n")
        content = raw[:-1] if complete else raw
        if not content:
            raise LedgerError("blank record")
        try:
            decoded = content.decode("utf-8")
            record = json.loads(decoded)
        except (UnicodeDecodeError, json.JSONDecodeError) as error:
            if index == len(lines) - 1 and not complete:
                return ReadResult(tuple(records), offset)
            raise LedgerError(f"corrupt record at byte {offset}") from error
        if not isinstance(record, dict):
            raise LedgerError(f"corrupt record at byte {offset}")
        if record.get("schema_version") != 1:
            raise LedgerError("unsupported schema")
        record_id = record.get("record_id")
        if not isinstance(record_id, str) or not record_id:
            raise LedgerError("record_id must be non-empty")
        records.append(record)
        offset += len(raw)
    return ReadResult(tuple(records), len(data))
''')
PY
"""
