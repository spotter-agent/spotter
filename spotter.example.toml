config_schema = "spotter.config"
config_schema_version = 1
observation_only = true
snapshot_on_patch = true

[main_agent]
adapter = "codex"

[reviewer]
# "default" uses your codex account's model. Pin an id (e.g. "gpt-5.3-spark")
# only if your auth supports it — rejected ids fail slowly, not fast.
model = "default"
# on_signals = true  # run durable signal jobs asynchronously (spends model tokens)
# deliver_on_signals = true  # live steer; requires on_signals and observation_only = false
# shadow_interrupt = true  # journal what INTERRUPT would target; never sends turn/interrupt
# every_steps = 25  # auto shadow review cadence (0 = off; spends model tokens)
# Each decision records signal/periodic/manual trigger provenance for cohort comparison.
# max_per_session = 20   # ceilings on review spend; a cadence without one
# max_per_day = 100      # offers an unbounded background bill (issue #52)

[gates]
forbidden_paths = []
block_dependency_changes = false

# Exact server/tool metadata takes precedence over MCP name heuristics. Unknown
# MCP operations remain conservative Class C. Never list secret-bearing fields.
# [mcp_semantics."inventory"."lookup_item"]
# operation = "read"
# reversibility = "A"
# resource_fields = ["item_id"]
